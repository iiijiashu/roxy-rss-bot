name: Roxy Daily RSS

on:
  schedule:
    # 00:20 UTC = 08:20 China Standard Time.
    - cron: "20 0 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Commit generated reports and publish Pages
        required: false
        default: false
        type: boolean

concurrency:
  group: roxy-daily-rss
  cancel-in-progress: false

permissions: {}

jobs:
  digest:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore published digest history
        env:
          PUBLISH_BRANCH: digest-output
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/${PUBLISH_BRANCH}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/${PUBLISH_BRANCH}:refs/remotes/origin/${PUBLISH_BRANCH}"
            git checkout "refs/remotes/origin/${PUBLISH_BRANCH}" -- digests manifest.json feed.xml
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate batched Agnes digest and RSS
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          AGNES_MODEL: agnes-2.5-flash
          AGNES_BATCH_WINDOW_MS: "25"
          AGNES_MAX_BATCH_TASKS: "64"
          AGNES_MAX_BATCH_INPUT_BYTES: "1000000"
          AGNES_MAX_BATCH_OUTPUT_TOKENS: "60000"
          AGNES_REQUEST_BUDGET: "4"
          LLM_PROVIDER: agnes
          LLM_MAX_TOKENS: "4000"
          LLM_CONCURRENCY: "64"
          PAGES_URL: https://${{ github.repository_owner }}.github.io/roxy-rss-bot
        run: |
          pnpm start
          pnpm manifest
          echo "DIGEST_DATE=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_ENV"

      - name: Upload manual validation output
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roxy-digest-${{ github.run_id }}
          path: |
            digests/${{ env.DIGEST_DATE }}/
            manifest.json
            feed.xml
          if-no-files-found: error
          retention-days: 3

      - name: Commit generated content to publishing branch
        if: github.event_name == 'schedule' || inputs.publish
        env:
          PUBLISH_BRANCH: digest-output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/ manifest.json feed.xml
          generated_tree="$(git write-tree)"
          if git rev-parse --verify --quiet "refs/remotes/origin/${PUBLISH_BRANCH}" >/dev/null; then
            previous_commit="$(git rev-parse "refs/remotes/origin/${PUBLISH_BRANCH}")"
            previous_tree="$(git rev-parse "${previous_commit}^{tree}")"
            if [ "${generated_tree}" = "${previous_tree}" ]; then
              echo "No generated changes to commit"
              exit 0
            fi
            published_commit="$(printf '%s\n' "digest: ${DIGEST_DATE} daily RSS" | git commit-tree "${generated_tree}" -p "${previous_commit}" -p "${GITHUB_SHA}")"
          else
            published_commit="$(printf '%s\n' "digest: ${DIGEST_DATE} daily RSS" | git commit-tree "${generated_tree}" -p "${GITHUB_SHA}")"
          fi
          if [ -z "${published_commit}" ]; then
            echo "No generated changes to commit"
            exit 0
          fi
          git push origin "${published_commit}:refs/heads/${PUBLISH_BRANCH}"

  pages:
    if: github.event_name == 'schedule' || inputs.publish
    needs: digest
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      source_ref: digest-output
