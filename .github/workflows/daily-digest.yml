name: Roxy Daily RSS

on:
  schedule:
    # 00:20 UTC = 08:20 China Standard Time.
    - cron: "20 0 * * *"
  workflow_dispatch:

concurrency:
  group: roxy-daily-rss
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Chinese-first digest and RSS
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_PROVIDER: github-copilot
          GITHUB_COPILOT_MODEL: openai/gpt-4o-mini
          LLM_MAX_TOKENS: "4000"
          PAGES_URL: https://${{ github.repository_owner }}.github.io/roxy-rss-bot
        run: |
          pnpm start
          pnpm manifest

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/ manifest.json feed.xml
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "digest: ${DATE} daily RSS"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  pages:
    needs: digest
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
