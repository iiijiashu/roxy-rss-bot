name: Roxy Daily RSS

on:
  schedule:
    # 00:20 UTC = 08:20 China Standard Time.
    - cron: "20 0 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Commit generated reports and publish Pages
        required: false
        default: false
        type: boolean

concurrency:
  group: roxy-daily-rss
  cancel-in-progress: false

permissions: {}

jobs:
  digest:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      publishable: ${{ steps.validate.outputs.publishable }}
      deploy: ${{ steps.publish.outputs.deploy }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine digest date
        id: date
        run: |
          digest_date="$(TZ=Asia/Shanghai date +%F)"
          echo "date=${digest_date}" >> "$GITHUB_OUTPUT"
          echo "DIGEST_DATE=${digest_date}" >> "$GITHUB_ENV"

      - name: Restore published digest history
        env:
          PUBLISH_BRANCH: digest-output
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/${PUBLISH_BRANCH}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/${PUBLISH_BRANCH}:refs/remotes/origin/${PUBLISH_BRANCH}"
            git checkout "refs/remotes/origin/${PUBLISH_BRANCH}" -- digests manifest.json feed.xml
          fi
          # Never let a previous same-day publication make a failed rerun look healthy.
          rm -rf "digests/${DIGEST_DATE}"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate evidence-first Chinese digest
        id: generate
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_MODEL: agnes-2.5-flash
          AGNES_BATCH_WINDOW_MS: "25"
          AGNES_MAX_BATCH_TASKS: "2"
          AGNES_MAX_BATCH_INPUT_BYTES: "180000"
          AGNES_MAX_BATCH_OUTPUT_TOKENS: "12000"
          # The evidence-first pipeline performs at most three logical synthesis
          # calls; keep bounded physical headroom for split/retry recovery.
          AGNES_REQUEST_BUDGET: "8"
          AGNES_RETRY_BUDGET: "5"
          AGNES_MAX_TASK_ATTEMPTS: "3"
          AGNES_MAX_IN_FLIGHT: "1"
          AGNES_TIMEOUT_MS: "180000"
          AGNES_RETRY_BASE_MS: "1000"
          LLM_PROVIDER: agnes
          LLM_MAX_TOKENS: "6000"
          LLM_CONCURRENCY: "2"
          # One synthesis plus up to two narrowly gated correction attempts.
          # Provider-level split/retry remains separately bounded by AGNES_REQUEST_BUDGET.
          LLM_CALL_BUDGET: "3"
          HTTP_TIMEOUT_MS: "20000"
          PAGES_URL: https://${{ github.repository_owner }}.github.io/roxy-rss-bot
        run: pnpm start

      - name: Rebuild manifest and feed
        id: manifest
        if: always()
        continue-on-error: true
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/roxy-rss-bot
        run: pnpm manifest

      - name: Validate publication boundary
        id: validate
        if: always()
        run: |
          echo "publishable=false" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.generate.outcome }}" != "success" ]; then
            echo "Digest process exited unsuccessfully; refusing to publish partial state." >&2
            exit 1
          fi
          if [ "${{ steps.manifest.outcome }}" != "success" ]; then
            echo "Manifest/feed generation failed; refusing to publish." >&2
            exit 1
          fi
          pnpm validate:publication "${DIGEST_DATE}"
          echo "publishable=true" >> "$GITHUB_OUTPUT"

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Roxy Daily RSS"
            echo ""
            echo "- Date: \`${DIGEST_DATE}\`"
            echo "- Generate step: \`${{ steps.generate.outcome }}\`"
            echo "- Manifest step: \`${{ steps.manifest.outcome }}\`"
            echo "- Publishable: \`${{ steps.validate.outputs.publishable || 'false' }}\`"
            if [ -f "digests/${DIGEST_DATE}/run-status.json" ]; then
              echo "- Publication health: \`$(jq -r '.status' "digests/${DIGEST_DATE}/run-status.json")\`"
              echo ""
              echo "### Degraded components"
              jq -r '.components[] | select(.state == "degraded") | "- `" + .component + "`: `" + (.code // "unknown") + "`"' \
                "digests/${DIGEST_DATE}/run-status.json"
            fi
            if [ -f "digests/${DIGEST_DATE}/llm-diagnostics.json" ]; then
              echo ""
              echo "### LLM diagnostics"
              jq -c '.' "digests/${DIGEST_DATE}/llm-diagnostics.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roxy-digest-${{ github.run_id }}
          path: |
            digests/${{ env.DIGEST_DATE }}/
            manifest.json
            feed.xml
          if-no-files-found: warn
          retention-days: 3

      - name: Commit generated content to publishing branch
        id: publish
        if: steps.validate.outputs.publishable == 'true' && (github.event_name == 'schedule' || inputs.publish)
        env:
          PUBLISH_BRANCH: digest-output
        run: |
          echo "deploy=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/ manifest.json feed.xml
          generated_tree="$(git write-tree)"
          if git rev-parse --verify --quiet "refs/remotes/origin/${PUBLISH_BRANCH}" >/dev/null; then
            previous_commit="$(git rev-parse "refs/remotes/origin/${PUBLISH_BRANCH}")"
            previous_tree="$(git rev-parse "${previous_commit}^{tree}")"
            if [ "${generated_tree}" = "${previous_tree}" ]; then
              echo "No generated changes to commit"
              exit 0
            fi
            published_commit="$(printf '%s\n' "digest: ${DIGEST_DATE} daily RSS" | git commit-tree "${generated_tree}" -p "${previous_commit}" -p "${GITHUB_SHA}")"
          else
            published_commit="$(printf '%s\n' "digest: ${DIGEST_DATE} daily RSS" | git commit-tree "${generated_tree}" -p "${GITHUB_SHA}")"
          fi
          if [ -z "${published_commit}" ]; then
            echo "No generated changes to commit"
            exit 0
          fi
          git push origin "${published_commit}:refs/heads/${PUBLISH_BRANCH}"
          echo "published_commit=${published_commit}" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  pages:
    if: always() && needs.digest.outputs.deploy == 'true'
    needs: digest
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      source_ref: digest-output
