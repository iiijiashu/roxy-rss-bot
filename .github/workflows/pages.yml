name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch containing the generated site
        required: false
        default: main
        type: string
  workflow_call:
    inputs:
      source_ref:
        description: Branch containing the generated site
        required: false
        default: main
        type: string

concurrency:
  group: roxy-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout published content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref_name }}

      - name: Prepare minimal static site
        run: |
          test -f index.html
          test -f feed.xml
          test -f manifest.json
          test -d digests
          mkdir _site
          cp index.html feed.xml manifest.json .nojekyll _site/
          cp -R digests _site/digests

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
